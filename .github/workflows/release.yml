name: Release package

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package, for example v2.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-tools

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: release-source/package-lock.json

      - name: Install dependencies
        working-directory: release-source
        run: npm ci

      - name: Build
        working-directory: release-source
        run: npm run build

      - name: Prepare release assets
        working-directory: release-source
        run: node ../release-tools/scripts/prepare-release.mjs

      - name: Upload release assets
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/module.json dist/module.zip --clobber
          else
            gh release create "$TAG" dist/module.json dist/module.zip \
              --title "Release $TAG" \
              --notes "Automated release for version $VERSION"
          fi
